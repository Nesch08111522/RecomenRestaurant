{% extends 'base.html' %}
{% block content %}
<section class="container" style="padding:24px">
<h1>Explora el catalogo SmartResto</h1>
<p>Negocios y productos reales. Los horarios desconocidos no se consideran abiertos.</p>
<form id="catalog-search" style="display:flex;flex-wrap:wrap;gap:12px">
<label>Plato o ingrediente <input name="dish_query" data-search-history></label>
<label>Distrito <input name="district"></label>
<label>Presupuesto S/ <input name="max_price" type="number" min="0" step="0.01"></label>
<label>Puntuacion minima <input name="min_rating" type="number" min="0" max="5" step="0.1"></label>
<label>Categoria <select name="category_id"><option value="">Todas</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>
<label>Tipo <select name="business_type"><option value="">Todos</option>{% for kind in business_types %}<option>{{ kind }}</option>{% endfor %}</select></label>
<label>Modalidad <select name="channel"><option value="">Todas</option><option>Local</option><option>Recojo</option><option>Delivery</option></select></label>
<label>Horario <input name="at_time" type="time"></label>
<label><input name="open_now" type="checkbox">Abierto ahora</label>
<label><input name="available_only" type="checkbox">Productos disponibles</label>
<label><input name="promo_only" type="checkbox">Promociones</label>
<label>Radio km <input name="radius" type="number" min="0.1" max="100" step="0.1"></label>
<label>Orden <select name="sort_by"><option value="">Recomendacion</option><option value="rating">Puntuacion</option><option value="price">Precio</option><option value="distance">Distancia</option></select></label>
<button type="button" id="catalog-location">Usar mi ubicacion</button><button>Buscar</button>
</form>
<label>Consulta natural <input id="catalog-natural" placeholder="Ceviche hasta 30 soles para recoger"></label><button id="catalog-ai">Buscar con IA</button>
<p id="catalog-status" role="status"></p><button id="catalog-compare">Comparar seleccionados (2 a 4)</button>
<button id="catalog-compare-products" type="button">Comparar productos (2 a 4)</button>
<div id="catalog-comparison" aria-live="polite"></div>
<section id="catalog-product-card" hidden aria-label="Ficha de producto"></section>
<div id="catalog-results"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/catalog-explore.js') }}"></script>{% endblock %}
