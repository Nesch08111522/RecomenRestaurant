<div class="market-grid">{% for r in rows %}<article class="market-offer">{% if r.photo_id %}<img class="market-photo" src="{{ url_for('market.offer_photo',oid=r.id) }}" alt="{{ r.name }}" loading="lazy" width="400" height="300">{% endif %}<h2><a href="{{ url_for('market.offer_detail',oid=r.id) }}">{{ r.name }}</a></h2><p>{{ r.business }} · {{ r.price|soles }}</p><p>{{ r.why }}</p><p>{{ r.available }} porciones · {{ r.day }}</p></article>{% else %}<p>No hay ofertas disponibles con estas condiciones. Puedes cambiar tu presupuesto u ocasión.</p>{% endfor %}</div>
