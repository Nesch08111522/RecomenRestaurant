{% extends "market/base.html" %}{% from "market/base.html" import token with context %}{% block market %}<h1>¿Qué comemos entre todos?</h1>{% for g in groups %}<p><a href="{{ url_for('ecosystem.group',gid=g.id) }}">{{ g.title }}</a> · {{ g.members|length }} personas</p>{% endfor %}<form method="post" class="market-form">{{ token() }}<label>Nuevo grupo<input name="title" maxlength="100" required></label><button>Crear grupo</button></form><form method="post" class="market-form" action="{{ url_for('ecosystem.join_group') }}">{{ token() }}<label>Código privado de invitación<input name="invite" maxlength="80" required></label><button>Unirme</button></form>{% endblock %}
