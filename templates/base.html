<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ APP_NAME }} - Recomendación Inteligente de Restaurantes</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    

    
    {% block extra_head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interface.css') }}">
    <script src="{{ url_for('static', filename='js/shell.js') }}"></script>
</head>
<body class="{% if session.get('user') and request.blueprint in ['owner','admin','comunicacion','auth','market'] %}sr-private{% endif %}">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    {% include 'partials/header.html' %}
    
    <main id="main-content" class="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <!-- JavaScript Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Security helper must load before application scripts. -->
    <script src="{{ url_for('static', filename='js/security.js') }}"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
