<aside class="sr-location-consent" id="location-consent" aria-label="Preferencias de ubicación" hidden>
  <div><strong>Descubre lo que tienes cerca</strong><p>¿Permites usar tu ubicación para encontrar restaurantes cercanos y adaptar las recomendaciones al clima? Tu navegador solicitará permiso. Puedes cambiar esta decisión en cualquier momento.</p></div>
  <button type="button" data-location-accept>Aceptar y activar</button><button type="button" class="secondary" data-location-decline>Ahora no</button>
  <output role="status" data-location-status></output>
  <form class="sr-location-manual"><p>También puedes indicar coordenadas aproximadas desde tu aplicación de mapas.</p><label>Latitud<input name="lat" type="number" step="any" min="-90" max="90" required></label><label>Longitud<input name="lng" type="number" step="any" min="-180" max="180" required></label><button>Usar esta ubicación</button></form>
</aside>
