{% extends 'base.html' %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <h1>400</h1>
        <h2>No pudimos completar la operación</h2>
        <p>Tu sesión pudo expirar o la solicitud quedó desactualizada. Vuelve a iniciar sesión para continuar; tus datos no se perdieron.</p>
        <div class="error-actions">
            <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="btn-primary">Iniciar sesión</a>
            <a href="{{ url_for('main.index') }}" class="btn-secondary">Volver al inicio</a>
        </div>
    </div>
</div>

<style>
    .error-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 40px 20px; }
    .error-content { text-align: center; max-width: 52ch; }
    .error-content h1 { font-size: 64px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .error-content h2 { font-size: 28px; margin-bottom: 12px; }
    .error-content p { color: var(--gray); margin-bottom: 24px; }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
{% endblock %}
