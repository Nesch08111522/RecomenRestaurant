{% extends 'base.html' %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <h1>400</h1>
        <h2>No pudimos completar la operación</h2>
        <p>Tu sesión pudo expirar o la solicitud quedó desactualizada. Vuelve a iniciar sesión para continuar; tus datos no se perdieron.</p>
        <div class="error-actions">
            <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="btn-primary">Iniciar sesión</a>
            <a href="{{ url_for('main.index') }}" class="btn-secondary">Volver al inicio</a>
        </div>
    </div>
</div>

<style>
    .error-container { display: flex; justify-content: center; align-items: center; min-height: 60vh; padding:var(--space-xl) var(--space-md); }
    .error-content { text-align: center; max-width: 52ch; }
    .error-content h1 { font-size:var(--text-display); font-weight: 700; color: var(--theme-accent); margin-bottom: 12px; }
    .error-content h2 { font-size:var(--text-2xl); margin-bottom: 12px; }
    .error-content p { color: var(--theme-text); margin-bottom: 24px; }
    .error-actions { display: flex; gap:var(--space-sm); justify-content: center; flex-wrap: wrap; }
</style>
{% endblock %}
